schema_version: 1

context:
  name: decaylanguage
  version: "1.0.0"
  python_min: '3.10'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/decaylanguage-${{ version }}.tar.gz
  sha256: d05f49796cbd88c4b58cd5e89bf209390bb55573243dfb307a1d249d0ba9ea91

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - attrs >=22.2.0
    - python-graphviz
    - lark >=1.0.0
    - numpy >=1.19.3
    - pandas >=2.0
    - particle >=1.0.0
    - hepunits >=2.4.0
    - plumbum >=1.7.0

tests:
  - python:
      imports:
        - decaylanguage
        - decaylanguage.data
      pip_check: true
      python_version: ${{ python_min }}.*
about:
  summary: A language to describe particle decays, and tools to work with them.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-hep/decaylanguage
  repository: https://github.com/scikit-hep/decaylanguage
  documentation: https://decaylanguage.readthedocs.io/

extra:
  recipe-maintainers:
    - chrisburr
    - eduardo-rodrigues
    - conda-forge/scikit-hep
